name: Fork / Release

# Builds the Android app and publishes it as a GitHub release with the APK attached.
#
# Create a release by pushing a tag (for example `v0.1.0`) or by running this workflow manually
# with a version. Only release builds are published, in both flavours:
#   - libre       (fully free, no Chromecast)
#   - proprietary (with Chromecast support)
# Signing is required; without the signing secrets the workflow fails on purpose.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, without the "v" prefix (for example 0.1.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  # Optional signing configuration. Configure these repository secrets to publish a signed
  # release APK that can be installed over previous builds:
  #   KEYSTORE          base64 encoded keystore file
  #   KEYSTORE_PASSWORD keystore password
  #   KEY_ALIAS         signing key alias
  #   KEY_PASSWORD      signing key password
  KEYSTORE_BASE64: ${{ secrets.KEYSTORE }}
  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
  KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
  KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version-file: .tools-versions

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi

          if [ -z "$VERSION" ]; then
            echo "::error::Unable to determine the version to build"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Decode keystore
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The KEYSTORE secret is required to publish release builds"
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/keystore.jks"

      - name: Assemble release APKs
        run: |
          ./gradlew :app:assembleLibreRelease :app:assembleProprietaryRelease \
            "-Pjellyfin.version=${{ steps.version.outputs.version }}" \
            -Pkeystore.file="$RUNNER_TEMP/keystore.jks" \
            -Pkeystore.password="$KEYSTORE_PASSWORD" \
            -Psigning.key.alias="$KEY_ALIAS" \
            -Psigning.key.password="$KEY_PASSWORD"

      - name: Collect artifacts
        run: |
          mkdir -p build/fork-release
          find app/build/outputs/apk/libre/release app/build/outputs/apk/proprietary/release \
            -name '*.apk' -exec cp {} build/fork-release/ \;
          ls -la build/fork-release

      # The in-app updater reads latest.json from the newest release through
      # https://github.com/<owner>/<repo>/releases/latest/download/latest.json and compares versionCode
      # with BuildConfig.VERSION_CODE. File names are globbed so they always match what Gradle wrote.
      - name: Write update manifest
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          REPO="${{ github.repository }}"

          # Same formula as buildSrc/VersionUtils.getVersionCode: MA.MI.PA-PR -> MAMIPAPR,
          # with the pre-release number defaulting to 99.
          CORE="${VERSION%%-*}"
          MAJOR=$(echo "$CORE" | cut -d '.' -f 1)
          MINOR=$(echo "$CORE" | cut -d '.' -f 2)
          PATCH=$(echo "$CORE" | cut -d '.' -f 3)
          PRE=$(echo "$VERSION" | sed -n 's/^[^-]*-[^.]*\.\([0-9]\{1,\}\)$/\1/p')
          VERSION_CODE=$(( MAJOR * 1000000 + MINOR * 10000 + PATCH * 100 + ${PRE:-99} ))

          build_variant() {
            local flavor="$1"
            local file
            file=$(find build/fork-release -name "*-$flavor-release.apk" -print -quit)

            if [ -z "$file" ]; then
              echo "::error::No $flavor release APK found"
              exit 1
            fi

            local name size sha
            name=$(basename "$file")
            size=$(stat -c '%s' "$file")
            sha=$(sha256sum "$file" | cut -d ' ' -f 1)

            printf '    "%s": {\n      "url": "https://github.com/%s/releases/download/v%s/%s",\n      "size": %s,\n      "sha256": "%s"\n    }' \
              "$flavor" "$REPO" "$VERSION" "$name" "$size" "$sha"
          }

          {
            echo '{'
            echo "  \"version\": \"$VERSION\","
            echo "  \"versionCode\": $VERSION_CODE,"
            echo "  \"publishedAt\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\","
            echo "  \"variants\": {"
            build_variant libre
            echo ','
            build_variant proprietary
            printf '\n  }\n}\n'
          } > build/fork-release/latest.json

          cat build/fork-release/latest.json

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v$VERSION"

          NOTES=$(cat <<EOF
          Automated build of Jellykulik (Jellyfin for Android fork).

          Version: \`$VERSION\`
          Commit: \`$GITHUB_SHA\`

          ### Downloads

          | APK | Description |
          | --- | --- |
          | \`jellyfin-android-$VERSION-libre-release.apk\` | Fully free build, no Chromecast |
          | \`jellyfin-android-$VERSION-proprietary-release.apk\` | Includes Chromecast support |

          \`latest.json\` describes both builds and is read by the in-app updater, so installed apps
          offer this version without any further setup.

          Both are release builds signed with the fork's signing key, so they update in place.
          EOF
          )

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes "$NOTES"

            # Drop assets from earlier runs so only the current build remains.
            for asset in $(gh release view "$TAG" --json assets --jq '.assets[].name'); do
              gh release delete-asset "$TAG" "$asset" --yes
            done
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes "$NOTES" \
              --target "$GITHUB_SHA"
          fi

          gh release upload "$TAG" build/fork-release/*.apk build/fork-release/latest.json --clobber
